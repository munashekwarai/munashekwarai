<svg xmlns="http://www.w3.org/2000/svg" width="490" height="250" viewBox="0 0 490 250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="490" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06090D"/>
      <stop offset="0.58" stop-color="#0A0F15"/>
      <stop offset="1" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#71F0C1"/>
      <stop offset="100%" stop-color="#7798FF"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="490" height="250" rx="22" fill="url(#bg)"/>
  <rect width="490" height="250" rx="22" fill="url(#grid)"/>

  <text x="32" y="40"
        font-family="Consolas, Menlo, monospace"
        font-size="12"
        font-weight="700"
        fill="#71F0C1">06 / NETWORK BUILD</text>

  <text x="32" y="84"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="29"
        font-weight="750"
        fill="#F5F7FA">LAN CHAT</text>

  <text x="32" y="113"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="14"
        fill="#919CA7">Real-time communication across a local network</text>

  <!-- network/chat visual -->
  <g transform="translate(326 82)">
    <line x1="0" y1="40" x2="62" y2="4" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
    <line x1="0" y1="40" x2="66" y2="82" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
    <line x1="0" y1="40" x2="-56" y2="9" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
    <line x1="0" y1="40" x2="-55" y2="80" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>

    <circle cx="0" cy="40" r="13" fill="#0F171C" stroke="#71F0C1" stroke-width="1.5"/>
    <circle cx="62" cy="4" r="8" fill="#0F171C" stroke="#7798FF"/>
    <circle cx="66" cy="82" r="8" fill="#0F171C" stroke="#73C3E9"/>
    <circle cx="-56" cy="9" r="8" fill="#0F171C" stroke="#76DDCF"/>
    <circle cx="-55" cy="80" r="8" fill="#0F171C" stroke="#71F0C1"/>

    <!-- chat bubble -->
    <rect x="-14" y="26" width="28" height="20" rx="6" fill="url(#accent)" fill-opacity="0.18"/>
    <circle cx="-7" cy="36" r="2" fill="#DCE5EC"/>
    <circle cx="0" cy="36" r="2" fill="#DCE5EC"/>
    <circle cx="7" cy="36" r="2" fill="#DCE5EC"/>
  </g>

  <rect x="32" y="160" width="426" height="1" fill="#FFFFFF" fill-opacity="0.07"/>

  <text x="32" y="194"
        font-family="Consolas, Menlo, monospace"
        font-size="12"
        fill="#7D8894">Routing · TCP/IP · HTTPS · Sockets</text>

  <text x="426" y="221"
        text-anchor="end"
        font-family="Consolas, Menlo, monospace"
        font-size="12"
        font-weight="700"
        fill="#71F0C1">OPEN REPOSITORY ↗</text>
</svg>