        font-weight="700"
        letter-spacing="1.2"
        fill="#72F0C1">02 / ENGINEERING RANGE</text>

  <text x="72" y="118"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="38"
        font-weight="700"
        letter-spacing="-1"
        fill="#F4F6F8">Built across the stack.</text>

  <text x="72" y="151"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="16"
        fill="#87919D">Infrastructure below. Intelligence within. Software on top.</text>

  <!-- top rule -->
  <rect x="72" y="188" width="1256" height="1" fill="#FFFFFF" fill-opacity="0.08"/>
  <rect x="72" y="188" width="245" height="2" fill="url(#accent)"/>

  <!-- column separators -->
  <rect x="384" y="226" width="1" height="186" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="699" y="226" width="1" height="186" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="1014" y="226" width="1" height="186" fill="#FFFFFF" fill-opacity="0.07"/>

  <!-- 01 -->
  <g transform="translate(72 226)">
    <text x="0" y="45"
