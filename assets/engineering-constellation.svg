<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070A0F"/>
      <stop offset="0.55" stop-color="#0A0E14"/>
      <stop offset="1" stop-color="#07090D"/>
    </linearGradient>

    <linearGradient id="accent" x1="72" y1="0" x2="1328" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#72F0C1"/>
      <stop offset="0.5" stop-color="#70D5DB"/>
      <stop offset="1" stop-color="#7B97FF"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.022" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- canvas -->
  <rect width="1400" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="520" rx="28" fill="url(#grid)"/>

  <!-- header -->
  <text x="72" y="62"
